<style>
/* Layout: fixed 1600x900 stage scaled to the window; RA site tokens (violet + yellow + navy, Syne + Poppins, pill buttons, 20px cards). */
:root{
  --bg:#F3F6FD; --card:#FFFFFF; --ink:#152039; --muted:#4F5B72; --line:#DCE3F2;
  --acc:#4862DD; --acc-ink:#FFFFFF; --yel:#FEC404; --yel-ink:#152039; --cyan:#06A1EE;
  --good:#0B7A4B; --warn:#7A4B00; --warn-bg:#FFF4D1; --bad:#B3261E;
  --grad:linear-gradient(100deg,#5058DA 0%,#3F6FE0 60%,#2C82E4 100%);
  --head:'Syne','Poppins',sans-serif; --body:'Poppins',system-ui,sans-serif;
  --r:20px; --pill:30px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1730; --card:#16213F; --ink:#EEF2FF; --muted:#A7B2CC; --line:#2A3658;
    --acc:#8FA3FF; --acc-ink:#0E1730; --good:#4ADE9A; --warn:#FFD667; --warn-bg:#2A2210; --bad:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1730; --card:#16213F; --ink:#EEF2FF; --muted:#A7B2CC; --line:#2A3658;
  --acc:#8FA3FF; --acc-ink:#0E1730; --good:#4ADE9A; --warn:#FFD667; --warn-bg:#2A2210; --bad:#FF8A80;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#0A1024;color:var(--ink);font-family:var(--body);overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;flex:none;transform-origin:center center;background:var(--bg);position:relative;overflow:hidden;border-radius:6px}
.slide{position:absolute;inset:0;display:none;flex-direction:column}
.slide.on{display:flex}
.top{background:var(--grad);color:#fff;padding:22px 44px 20px;display:flex;align-items:center;gap:20px;flex:none}
.top h1{font-family:var(--head);font-weight:800;font-size:44px;line-height:1.1;margin:0;flex:1;text-wrap:balance}
.top .kick{font-size:17px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.9;display:block;margin-bottom:4px}
.top .em{font-size:54px;line-height:1}
.top img.logo{height:44px;opacity:.95}
.body{flex:1;padding:24px 44px 58px;display:grid;gap:22px;min-height:0}
.c3{grid-template-columns:1.05fr 1fr .9fr}
.c2{grid-template-columns:1.15fr 1fr}
.c1{grid-template-columns:1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0;min-height:0;overflow:hidden}
.card h3{font-family:var(--head);font-size:21px;margin:0 0 10px;color:var(--acc);letter-spacing:.02em}
.col{display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0}
p,li,td,th{font-size:22px;line-height:1.38}
p{margin:0 0 10px}
ul{margin:0;padding-left:24px} li{margin-bottom:7px}
li::marker{color:var(--yel)}
.lead{font-size:26px;font-weight:500;line-height:1.35}
.small{font-size:17px;color:var(--muted);line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--yel);color:var(--yel-ink);border-radius:var(--pill);padding:5px 15px;font-size:18px;font-weight:600;white-space:nowrap}
.chip.b{background:transparent;border:2px solid var(--acc);color:var(--acc)}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.price{border:2px solid var(--line);border-radius:16px;padding:10px 12px;text-align:center;position:relative}
.price b{font-family:var(--head);font-size:36px;display:block;line-height:1.1}
.price .lab{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--acc)}
.price .w{font-size:15px;color:var(--muted);line-height:1.25;display:block;margin-top:3px}
.price .n{position:absolute;top:-11px;right:-8px;background:var(--acc);color:var(--acc-ink);border-radius:20px;min-width:28px;padding:1px 8px;font-size:15px;font-weight:700}
.day{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.day span{font-size:19px;line-height:1.3}
.day .t{font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.media{border-radius:var(--r);overflow:hidden;background:#000;position:relative;flex:1;min-height:0}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
.media .tag{position:absolute;left:10px;bottom:10px;background:rgba(21,32,57,.82);color:#fff;font-size:16px;padding:3px 10px;border-radius:20px}
.vote{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:10px;font-size:18px;font-weight:600;cursor:default}
.bar i{display:block;height:20px;border-radius:10px;background:var(--line);position:relative;overflow:hidden}
.bar i u{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:10px;transition:width .4s}
.bar.go i u{background:var(--good)} .bar.no i u{background:var(--muted)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
body.manual .bar,body.manual .price{cursor:pointer}
.cm{font-size:16px;line-height:1.3;border-left:4px solid var(--yel);padding:2px 0 2px 10px;margin-top:6px;color:var(--ink)}
.cm small{color:var(--muted)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-size:18px;line-height:1.3;vertical-align:top}
th{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.flag{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 16px;font-size:19px;line-height:1.35}
.big{font-family:var(--head);font-weight:800;font-size:44px;white-space:nowrap;line-height:1;color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.stat .l{font-size:17px;color:var(--muted);line-height:1.25;margin-top:4px}
.grid10{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;height:100%}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-height:0}
.tile .e{font-size:40px;line-height:1}
.tile b{font-family:var(--head);font-size:21px;line-height:1.15}
.tile .a{font-size:16px;color:var(--muted)}
.tile .s{margin-top:auto;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.step .e{font-size:38px} .step b{font-family:var(--head);font-size:23px;display:block;margin:4px 0}
.step .pr{font-family:var(--head);font-size:24px;color:var(--acc);font-weight:800;display:block;margin:6px 0}
.step p{font-size:18px;margin:0}
.ups{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 22px}
.up{display:grid;grid-template-columns:44px 1fr 150px 34px;gap:10px;align-items:center;font-size:19px;line-height:1.25}
.up .e{font-size:30px}.up small{display:block;font-size:15px;color:var(--muted)}
.up i{display:block;height:16px;border-radius:8px;background:var(--line);position:relative;overflow:hidden}
.up i u{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:8px;transition:width .4s}
.cover{background:#152039 right center/auto 100% no-repeat;justify-content:flex-end}
.cover .pan{width:880px;padding:50px 20px 50px 56px;color:#fff;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.cover .pan>div:first-child{flex:none!important}
.cover .qr{display:flex;gap:16px;align-items:center;text-align:left}
.cover h1{font-family:var(--head);font-weight:800;font-size:70px;line-height:1.02;margin:0 0 12px;text-wrap:balance}
.cover p{font-size:24px;margin:0;max-width:800px}
.qr{background:#fff;border-radius:18px;padding:14px;color:#152039;text-align:center;flex:none}
.qr .q{width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.qr b{display:block;font-size:17px;margin-top:6px}
.qr small{font-size:16px;display:block;max-width:210px;word-break:break-all}
#hud{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;background:rgba(21,32,57,.92);color:#fff;font-size:15px;z-index:5}
#hud button{font:inherit;font-weight:600;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:20px;padding:5px 13px;cursor:pointer}
#hud button:hover,#hud button:focus-visible{background:var(--yel);color:#152039;outline:none}
#hud .sp{flex:1}
#conn{font-weight:700}
#msg{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--yel);color:#152039;font-weight:700;font-size:20px;padding:10px 22px;border-radius:30px;z-index:9}
#over{position:absolute;inset:0;background:var(--bg);z-index:8;padding:30px;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-content:start}
#over button{font:inherit;font-size:17px;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
#over button.cur{border-color:var(--acc);border-width:3px}
#exp{position:absolute;inset:60px 120px;background:var(--card);border:2px solid var(--acc);border-radius:var(--r);z-index:9;padding:20px;display:flex;flex-direction:column;gap:10px}
#exp textarea{flex:1;font:14px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
#exp button{font:inherit;font-weight:700;background:var(--yel);color:#152039;border:0;border-radius:30px;padding:10px 22px;cursor:pointer;align-self:flex-start}
.wall{columns:3;column-gap:18px}
.wall .cm{break-inside:avoid;font-size:17px;margin:0 0 10px}
.rank{display:grid;grid-template-columns:34px 1fr 300px 150px;gap:10px;align-items:center;font-size:21px;padding:5px 0;border-bottom:1px solid var(--line)}
.rank i{display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--line)}
.rank i u{display:block;height:100%}.rank .g{background:var(--good)}.rank .t{background:var(--acc)}.rank .n{background:var(--muted)}
.gearrow{display:grid;grid-template-columns:1fr 220px 70px;gap:12px;align-items:center;font-size:22px;padding:8px 0;border-bottom:1px solid var(--line)}
.stars{color:var(--yel);font-size:26px;letter-spacing:2px}
.cs .lead{font-size:22px;margin-bottom:8px}.cs li{font-size:19px;margin-bottom:4px;line-height:1.3}.cs .card{padding:16px 20px}.cs .small{font-size:16px}
.tight td,.tight th{padding:5px 10px;font-size:17px}
.rank{font-size:15.5px;padding:1px 0;line-height:1.15;grid-template-columns:28px 1fr 170px 170px}.rank i{height:16px}.rank .small{white-space:nowrap;font-size:14px}
.grid10{grid-auto-rows:1fr;grid-template-columns:repeat(6,1fr);gap:9px}
.grid10 .tile .th{width:58px;height:58px;right:6px;bottom:6px}.grid10 .tile .s{padding-right:0}.grid10 .tile{padding:9px 10px}.grid10 .tile b{font-size:16.5px!important;line-height:1.15}.grid10 .tile .e{font-size:26px!important}.grid10 .tile .a,.grid10 .tile .s{font-size:13.5px!important}
table.tight2.pmap td,table.tight2.pmap th{padding:2px 9px;font-size:15px;line-height:1.15}.pmap+p,.pmap~.small{margin-top:4px;font-size:14px}
.tile{position:relative;padding:12px 14px;gap:4px}
.tile .e{font-size:34px}.tile b{font-size:19px}.tile .a{font-size:15px}.tile .s{font-size:15px}
.tile .st{position:absolute;top:10px;right:10px;background:var(--yel);color:var(--yel-ink);border-radius:20px;font-size:13px;font-weight:700;padding:2px 9px}
.tile.grp{background:var(--grad);color:#fff;border:0;cursor:default;justify-content:center}
.tile.grp b{font-size:22px}.tile.grp .a{color:#fff;opacity:.9}
.chip.s{background:var(--ink);color:var(--bg)}
.cmp{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--yel);border-radius:14px;padding:9px 13px;font-size:15.5px;line-height:1.3;flex:none}
.cmp b{color:var(--acc)}
.homeup{margin-top:9px;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:6px 11px;font-size:15.5px;line-height:1.3;font-weight:500}
.media.fit img{object-fit:contain}
.demo{display:grid;gap:10px}
.demo a{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;text-decoration:none;background:var(--grad);color:#fff;border-radius:18px;padding:11px 18px;font-size:21px;font-weight:600;line-height:1.2}
.demo a small{display:block;font-size:15px;font-weight:400;opacity:.92}
.demo a .k{font-family:var(--head);font-size:30px;background:var(--yel);color:var(--yel-ink);border-radius:12px;width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.demo a .go{font-size:26px}
.demo a:hover,.demo a:focus-visible{outline:4px solid var(--yel);outline-offset:2px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mi{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:9px 11px;font-size:16.5px;line-height:1.25}
.mi .e{font-size:28px;display:block}.mi b{display:block;font-size:17.5px}.mi span{color:var(--acc);font-weight:700}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px}
.qa div{font-size:16.5px;line-height:1.3;border-left:4px solid var(--yel);padding:1px 0 1px 10px}
.qa b{display:block}
.qa span{color:var(--muted)}
.tight2 td,.tight2 th{padding:4px 9px;font-size:16px;line-height:1.25}
.ups{gap:14px 26px}.up{font-size:19px;grid-template-columns:44px 1fr 130px 30px}.up small{font-size:15px}.up .e{font-size:30px}
.big3 td,.big3 th{padding:7px 12px;font-size:17.5px;line-height:1.28}.big3 th{font-size:15px}
.qw{max-height:400px;overflow-y:auto;margin-top:14px;padding-right:8px;display:flex;flex-direction:column;gap:10px}.qc{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px 10px 16px;color:#fff;border-left:5px solid transparent}.qc.k{border-left-color:#4ade80;background:rgba(74,222,128,.16)}.qc .qt{flex:1;font-size:21px;line-height:1.3;overflow-wrap:anywhere}.qc small{opacity:.8;font-size:16px}.qc .tk{color:#4ade80;font-size:16px}.qb{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:24px;font-weight:800;cursor:pointer}.qb.y:hover,.qc.k .qb.y{background:#4ade80;color:#0b1020;border-color:#4ade80}.qb.n:hover{background:#f87171;color:#0b1020;border-color:#f87171}.qb:focus-visible{outline:3px solid #fff;outline-offset:2px}.qe{font-size:22px;opacity:.9;margin:0}
.less{margin-top:8px;padding-top:6px;border-top:1px solid rgba(127,127,127,.3);font-size:18px;line-height:1.3}.less a.lk{font-size:16px;padding:2px 11px;margin:5px 4px 0 0}.lsn{padding:10px 16px}.lsn h3{margin-bottom:4px}.lsn p{margin:0;font-size:14.5px;line-height:1.25}.lsn .small{font-size:12px}.orb.orb{gap:5px}.orb.orb img,.orb.orb .noi{width:52px;height:40px}.orb.orb p{font-size:14.5px}
.body.sv{display:grid;grid-template-columns:230px 1.1fr 1.25fr;grid-template-rows:1fr auto auto;gap:14px}.svt{display:flex;flex-direction:column;gap:10px}.svt .card{flex:1;padding:8px 14px;display:flex;flex-direction:column;justify-content:center}.svt b{font-size:38px;line-height:1;color:var(--acc)}.svt span{font-weight:700;font-size:18px}.svt i{font-style:normal;font-size:13px;opacity:.8;line-height:1.15}.svb{display:grid;grid-template-columns:1fr 130px 62px;gap:8px;align-items:center;font-size:15.5px;line-height:1.15;margin-bottom:7px}.svb .b{height:12px;border-radius:6px;background:rgba(127,127,127,.22);overflow:hidden}.svb .b i{display:block;height:100%;background:var(--acc);border-radius:6px}.svb .v{text-align:right;font-weight:700}.svf{grid-column:1/-1;font-size:15.5px;line-height:1.3}.svn{grid-column:1/-1;margin:0;font-size:12.5px}
table.tight2.pnl{width:100%}table.tight2.pnl td,table.tight2.pnl th{padding:2px 6px;font-size:15px;line-height:1.15}.pp{display:inline-block;min-width:34px;padding:1px 0;border-radius:999px;text-align:center;font-weight:800;color:#0b1020}.pp.g{background:#4ade80}.pp.a{background:#fbbf24}.pp.r{background:#f87171}
table.tight2.pl{width:100%;table-layout:auto}table.tight2.pl td,table.tight2.pl th{padding:5px 5px;font-size:15.5px;line-height:1.15}.pl img{width:54px;height:40px;object-fit:cover;border-radius:6px;display:block;background:#fff}
.orb{display:flex;flex-direction:column;gap:11px}.orb>div{display:flex;gap:10px;align-items:center}.orb img,.orb .noi{width:62px;height:48px;object-fit:cover;border-radius:8px;flex:none;background:var(--bg);display:grid;place-items:center;font-size:24px}.orb p{margin:0;font-size:16.5px;line-height:1.2}.orb a.lk{font-size:12.5px;padding:0 9px;margin-top:2px}
.mg6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mg6>div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:7px;font-size:15px;line-height:1.2}.mg6 img{width:100%;height:150px;object-fit:cover;border-radius:10px;display:block;margin-bottom:4px}.mg6 b{display:block;font-size:15.5px}.mg6 span{color:var(--acc);font-weight:700}

<body>
<div id="wrap"><div id="stage">
  <div id="slides"></div>
  <div id="hud">
    <span id="conn">⚪ …</span>
    <span id="cnt"></span>
    <span class="sp"></span>
    <span id="pos"></span>
    <button id="bPrev" type="button">←</button><button id="bNext" type="button">→</button>
    <button id="bDemo" type="button" title="D">🎮 Demo</button>
    <button id="bGrid" type="button" title="G">▦</button>
    <button id="bLang" type="button" title="L">EN</button>
    <button id="bTheme" type="button" title="T">◐</button>
    <button id="bManual" type="button" title="M">✋ M</button>

  /* next */
  S.push({id:'next',title:T(['Kas toliau','What next']),html:top(T(['Iki gruodžio 18 d.','By December 18']),T(['Kas toliau','What happens next']),'🧭')+
   '<div class="body c2"><div class="card"><h3>'+T(['3 sprendimai, kurių prašom 12-18','3 decisions we ask for on 12-18'])+'</h3><ul><li>'+T(['Kurios 3–4 koncepcijos eina į 2027 vasarą kaip testas','Which 3–4 concepts go into summer 2027 as a test'])+'</li><li>'+T(['Kaina kiekvienai: pigiau, tiek pat ar brangiau','The price for each: cheaper, same or premium'])+'</li><li>'+T(['Kurie 3 papildomi pardavimai paleidžiami kartu','Which 3 upsells launch with them'])+'</li></ul><h3 style="margin-top:16px">'+T(['Nuo rudens būreliuose','In clubs from autumn'])+'</h3><p>'+T(['Kas vasarą surenka pilnas grupes ir gerus tėvų įvertinimus, rugsėjį tampa būreliu.','Whatever fills its groups and earns good parent ratings in summer becomes a club in September.'])+'</p></div>'+
   '<div class="card"><h3>'+T(['Patikrinimai iki gruodžio 1 d. (savininką sutariam dabar)','Checks by December 1 (we agree owners now)'])+'</h3><table class="tight">'+
   RD_CHECKS.map(function(r){return '<tr><td>'+T(r)+'</td><td class="num" style="color:var(--muted)">'+T(['kas? ____','who? ____'])+'</td></tr>';}).join('')+'</table><p class="small" style="margin-top:10px">'+T(['Balsai ir komentarai: mygtukas ⬇ E apačioje nukopijuoja suvestinę.','Votes and comments: the ⬇ E button below copies the summary.'])+'</p></div></div>'});
  /* sources */
  S.push({id:'src',title:T(['Šaltiniai','Sources']),html:top(T(['Priedas','Appendix']),T(['Šaltiniai ir ko nežinom','Sources and what we do not know']),'📚')+
   '<div class="body c2"><div class="card"><h3>'+T(['Šaltiniai (wiki)','Sources (wiki)'])+'</h3><ul><li>research/ra-vasaros-stovyklos-2027/00-sinteze + 06-brainstorm-faktu-lapas + 07-brainstorm-v2-palyginimai + 08-vadovu-panele</li><li>research/ra-produktu-kryptis-2026-11/13-vincibot-sinteze</li><li>research/ra-zaidimas-2026-11/00-sinteze</li><li>research/unitree-r1-edu-2026-10</li><li>RA KPI lentelė 2026 (05-kpi-lentele-2026)</li><li>10-creator-camp-gilus (creatorcamp.org skaityta 2026-11-15; video = Creator Camp autorių teisės, tik vidiniam rodymui)</li><li>research/ra-vasaros-stovyklos-2027/09-creator-camp (spauda: Community Impact 2026-03, ABC13 2024-03, The Hustle 2024-10)</li><li>'+RD_SRC.map(function(x){return '<a class="lk" href="'+x[1]+'" target="_blank" rel="noopener">'+x[0]+' ↗</a>';}).join(' ')+'</li></ul><p class="small">'+T(['Personažai ir viršeliai: RA 2026/27 turinys, tik vidiniam naudojimui. Produktų nuotraukos: gamintojų.','Characters and covers: RA 2026/27 content, internal use only. Product photos: from the makers.'])+'</p></div>'+
   '<div class="card"><h3>'+T(['Ko nežinom ❓','What we do not know ❓'])+'</h3><ul><li>'+T(['Tiksli perpardavėjo kaina RA: laukiam rašytinio kainoraščio','The exact reseller price for RA: we wait for the written price list'])+'</li><li>'+T(['Faktinė stovyklų marža pagal temą','Actual camp margin by theme'])+'</li><li>'+T(['Kiek LT tėvų pirktų priedus ir atributiką: skaičių nėra','How many LT parents would buy add-ons and merch: no numbers'])+'</li><li>'+T(['LT taisyklės: maistas su vaikais, santykis privačiose stovyklose','LT rules: cooking with kids, ratio in private camps'])+'</li><li>'+T(['Nė vieno naujo roboto dar netestavom su RA vaikais','We have not yet tested a single new robot with RA kids'])+'</li><li>'+T(['Visi įvertinimai šioje salėje = vadovų nuomonė, ne tėvų','All ratings in this room = leaders\' opinion, not parents\''])+'</li></ul></div></div>'});
  S.push({id:'thanks',title:T(['Ačiū','Thank you']),cls:'cover',style:'background-image:url(img/dogs2.jpg)',html:
   '<div class="pan"><div style="flex:1"><h1>'+T(['Ačiū! Dar klausimų?','Thank you! Any more questions?'])+'</h1><p>'+T(['Parašyk klausimą ar komentarą telefone: jis atsiras čia. Balsuoti dar galima.','Write a question or comment on your phone: it shows up here. Voting is still open.'])+'</p><div class="qw">'+(QA.map(function(q){return '<div class="qc'+(q.k?' k':'')+'"><div class="qt">'+(q.k?'<b class="tk">✓ '+T(['Atsakysim','We will answer'])+'</b> ':'')+esc(q.t)+(q.name?' <small>· '+esc(q.name)+'</small>':'')+'</div><button type="button" class="qb y" data-qk="'+esc(q.id)+'" aria-label="'+T(['Palikti','Keep'])+'">✓</button><button type="button" class="qb n" data-qx="'+esc(q.id)+'" aria-label="'+T(['Pašalinti','Remove'])+'">✕</button></div>';}).join('')||'<p class="qe">📱 '+T(['Klausimus rašykite telefone: jie atsiras čia.','Write your questions on your phone: they appear here.'])+'</p>')+'</div><p style="font-size:20px;opacity:.85;margin-top:14px">Kristijonas Vasiliauskas · Povilas Zmejauskas</p></div>'+
   '<div class="qr"><div class="q" id="qr2"></div><b>📱 '+T(['Klausk ir balsuok','Ask and vote'])+'</b><small>'+RV_JOIN_URL.replace('https://','')+'</small></div></div>'});
  S.forEach(function(s){var p=RD_PIC[s.id],i=0;if(p)s.html=s.html.replace(/<li>/g,function(){var e=p[i++];return e?'<li class="pi"><span class="pe">'+e+'</span>':'<li>';});var q=RD_PIC_TR[s.id],j=0;if(q)s.html=s.html.replace(/<tr><td>/g,function(){var e=q[j++];return e?'<tr><td><span class="pe2">'+e+'</span> ':'<tr><td>';});});
  return S;
}

/* ---------- render / nav ---------- */
function render(){
  SLIDES=build().filter(function(s){return ['world','map','alpha','idtech','ccprice','ccgaps','creatorwhy','gaps','packs','gear','panel','src'].indexOf(s.id)<0;});
  var box=$('slides'),h='';
  /* remember open folds + scroll of the visible slide: a phone vote rebuilds the DOM and must not close them */
  var keepI=-1,keepOpen=[],keepScroll=[];
  var old=box.querySelector('.slide.on');
  if(old){keepI=+old.getAttribute('data-i');old.querySelectorAll('details').forEach(function(d,n){if(d.open)keepOpen.push(n);});old.querySelectorAll('.body,.col,.card,details').forEach(function(el,n){if(el.scrollTop)keepScroll.push([n,el.scrollTop]);});var ov=old.querySelector('video');var keepT=ov?ov.currentTime:0;}
  SLIDES.forEach(function(s,i){h+='<section class="slide '+(s.cls||'')+(i===CUR?' on':'')+'" data-i="'+i+'"'+(s.style?' style="'+s.style+'"':'')+'>'+s.html+'</section>';});
  box.innerHTML=h;
  if(keepI===CUR){var now=box.querySelector('.slide.on');if(now){var ds=now.querySelectorAll('details');keepOpen.forEach(function(n){if(ds[n])ds[n].open=true;});var sc=now.querySelectorAll('.body,.col,.card,details');keepScroll.forEach(function(p){if(sc[p[0]])sc[p[0]].scrollTop=p[1];});var nv=now.querySelector('video');if(nv&&keepT){try{nv.currentTime=keepT;}catch(e){}}}}
  try{sessionStorage.setItem('ravasara-v2-cur',String(CUR));}catch(e){}
  box.querySelectorAll('video').forEach(function(v){v.addEventListener('error',function(){var im=document.createElement('img');im.src=v.getAttribute('data-fallback');var t=v.parentNode.querySelector('.tag');if(t)t.remove();v.parentNode.replaceChild(im,v);});});
  $('pos').textContent=(CUR+1)+' / '+SLIDES.length;
  $('bLang').textContent=LANG==='lt'?'EN':'LT';
  $('cnt').textContent='📱 '+people().length;
  document.documentElement.lang=LANG;
  qr();
}
var playing=false;
function softRender(){ /* do not rebuild while a video plays */
  var v=document.querySelector('.slide.on video');
  if(v&&!v.paused){playing=true;$('cnt').textContent='📱 '+people().length;return;}
  render();
}
function go(i){CUR=Math.max(0,Math.min(SLIDES.length-1,i));render();sendState();}
function goId(id){for(var i=0;i<SLIDES.length;i++)if(SLIDES[i].id===id){go(i);return;}}
function fit(){var s=Math.min(window.innerWidth/1600,window.innerHeight/900);$('stage').style.transform='scale('+s+')';}
function flash(t){var m=$('msg');m.textContent=t;m.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(function(){m.hidden=true;},2200);}
function qr(){['qr1','qr2'].forEach(function(id){var el=$(id);if(!el)return;if(window.QRCode){try{el.innerHTML='';new QRCode(el,{text:RV_JOIN_URL,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});}catch(e){}}else{el.textContent='QR';}});}
function overview(){var o=$('over');if(!o.hidden){o.hidden=true;return;}o.innerHTML=SLIDES.map(function(s,i){return '<button type="button" data-i="'+i+'" class="'+(i===CUR?'cur':'')+'">'+(i+1)+'. '+s.title+'</button>';}).join('');o.hidden=false;}
function exportAll(){
  var L=['# RA Vasara 2027 · idėjų dirbtuvės · '+new Date().toISOString().slice(0,16),'Telefonai: '+people().length,'','## Koncepcijos (❤️ / 🧪 / ✋ · pigiau / tiek pat / brangiau)'];
  RV_CONCEPTS.forEach(function(c){var r=tallyC(c.id);L.push('- '+c.n[0]+': '+r.go+' / '+r.test+' / '+r.no+' · '+r.low+' / '+r.same+' / '+r.high);r.cm.forEach(function(m){L.push('  - „'+m.m+'“ ('+(m.n||'?')+')');});});
  L.push('','## Papildomi pardavimai');RV_UPSELLS.forEach(function(u){L.push('- '+u.n[0]+': '+tallyU(u.id));});
  L.push('','## Įranga');RV_GEAR.forEach(function(g){var t=tallyG(g.id);L.push('- '+g.n[0]+': '+(t.n?t.avg.toFixed(1)+' ('+t.n+')':'nevertinta'));t.cm.forEach(function(m){L.push('  - „'+m.m+'“ ('+(m.n||'?')+')');});});
  L.push('','## Klausimai komandai');allQs().forEach(function(q){L.push('- '+(q.k?'[✓ atsakysim] ':'')+'„'+q.t+'“ ('+(q.name||'?')+')');});L.push('','## Naudingumas 1–10');people().forEach(function(p){if(p.sc)L.push('- '+p.sc+(p.scm?' · „'+p.scm+'“':'')+' ('+(p.name||'?')+')');});
  L.push('','## JSON','```json',JSON.stringify(ST),'```');
  $('expT').textContent=T(['Suvestinė: nukopijuok ir įklijuok Neuron','Summary: copy and paste to Neuron']);
  $('expA').value=L.join('\n');$('exp').hidden=false;
}
var resetArm=0;
function resetAll(){var n=Date.now();if(n-resetArm>3000){resetArm=n;flash(T(['Tikrai išvalyti visus balsus? Spausk ↺ arba Shift+X dar kartą per 3 s','Really clear all votes? Press ↺ or Shift+X again within 3 s']));return;}
  ST={epoch:Math.max(Date.now(),(+ST.epoch||0)+1),people:{},manual:{}};save();send('reset',{epoch:ST.epoch});CUR=0;render();flash(T(['Išvalyta','Cleared']));}

/* ---------- live room (Supabase Realtime broadcast, nothing stored on a server) ---------- */
var ch=null,ok=false;
function adoptEpoch(e){ST={epoch:e,people:{},manual:{}};save();softRender();}
function send(ev,pl){if(!ch||!ok)return;try{ch.send({type:'broadcast',event:ev,payload:pl});}catch(e){}}
function sendState(){var s=SLIDES[CUR]||{};send('state',{slide:s.id,epoch:ST.epoch});}
function connect(){
  if(typeof supabase==='undefined'||!supabase.createClient){$('conn').textContent='🔴 '+T(['be ryšio: M = rankinis režimas','offline: M = manual mode']);return;}
  try{
    var cl=supabase.createClient(RV_SB_URL,RV_SB_KEY);
    ch=cl.channel(RV_CHANNEL,{config:{broadcast:{self:false}}});
    ch.on('broadcast',{event:'full'},function(m){var p=m&&m.payload;if(!p||!p.cid)return;var pe=+p.epoch||0;if(pe>ST.epoch)adoptEpoch(pe);else if(pe&&pe<ST.epoch)return;
      ST.people[String(p.cid).slice(0,40)]={name:String(p.name||'').slice(0,30),c:p.c||{},ups:(p.ups||[]).slice(0,3),gear:p.gear||{},sc:p.sc||0,scm:String(p.scm||'').slice(0,400),q:String(p.q||'').slice(0,300),qs:Array.isArray(p.qs)?p.qs.slice(0,10).map(function(q){return {i:String((q&&q.i)||'').slice(0,24),t:String((q&&q.t)||'').slice(0,200)};}):null};save();softRender();});
    /* kitas ekranas tame pačiame kambaryje: perimam didesnę epochą, nesipešam */
    ch.on('broadcast',{event:'state'},function(m){var e=+((m&&m.payload)||{}).epoch||0;if(e>ST.epoch)adoptEpoch(e);});
    ch.on('broadcast',{event:'reset'},function(m){var e=+((m&&m.payload)||{}).epoch||0;if(e>ST.epoch)adoptEpoch(e);});
    ch.subscribe(function(st){ok=(st==='SUBSCRIBED');$('conn').textContent=ok?'🟢 '+RV_ROOM+' · '+T(['gyvai','live']):'🟡 …';if(ok)sendState();});
    setInterval(sendState,4000);
  }catch(e){$('conn').textContent='🔴';}
}
function lib(u,cb){var s=document.createElement('script');s.src=u;s.onload=cb;s.onerror=cb;document.head.appendChild(s);}

/* ---------- events ---------- */
document.addEventListener('keydown',function(e){
  if(!$('exp').hidden){if(e.key==='Escape')$('exp').hidden=true;return;}
  var k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();go(CUR+1);}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(CUR-1);}
  else if(k==='Home')go(0); else if(k==='End')go(SLIDES.length-1);
  else if(k==='g'||k==='G')overview();
  else if(k==='d'||k==='D')goId('game');
  else if(k>='1'&&k<='9'&&(SLIDES[CUR]||{}).id==='game'){var dl=document.querySelector('.slide.on [data-demo="'+(+k-1)+'"]');if(dl)window.open(dl.href,'_blank','noopener');}
  else if(k==='l'||k==='L')$('bLang').click();
  else if(k==='t'||k==='T')$('bTheme').click();
  else if(k==='m'||k==='M')$('bManual').click();
  else if(k==='e'||k==='E')exportAll();
  else if(k==='f'||k==='F')$('bFull').click();
  else if(k==='X'&&e.shiftKey)resetAll();
  else if(k==='y'||k==='Y'){var v=document.querySelector('.slide.on video');if(v){if(v.paused)v.play();else v.pause();}}
  else if(k==='Escape')$('over').hidden=true;
});
$('bPrev').onclick=function(){go(CUR-1);};$('bNext').onclick=function(){go(CUR+1);};
$('bGrid').onclick=overview;$('bDemo').onclick=function(){goId('game');};$('bExp').onclick=exportAll;$('bReset').onclick=resetAll;
$('bLang').onclick=function(){LANG=LANG==='lt'?'en':'lt';try{localStorage.setItem('ravasara-lang',LANG);}catch(e){}render();};
$('bTheme').onclick=function(){var r=document.documentElement,c=r.getAttribute('data-theme');var dark=c?c==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',dark?'light':'dark');};
$('bManual').onclick=function(){MANUAL_ON=!MANUAL_ON;document.body.classList.toggle('manual',MANUAL_ON);flash(MANUAL_ON?T(['Rankinis režimas: spausk juostą +1, Shift −1','Manual mode: click a bar +1, Shift −1']):T(['Rankinis režimas išjungtas','Manual mode off']));};
$('bFull').onclick=function(){var d=document;if(d.fullscreenElement)d.exitFullscreen();else if(d.documentElement.requestFullscreen)d.documentElement.requestFullscreen().catch(function(){});};
$('expX').onclick=function(){$('exp').hidden=true;};
$('expC').onclick=function(){var a=$('expA');a.select();if(navigator.clipboard)navigator.clipboard.writeText(a.value).then(function(){flash('✓');},function(){});};
$('over').addEventListener('click',function(e){var b=e.target.closest('button');if(b){$('over').hidden=true;go(+b.getAttribute('data-i'));}});
$('slides').addEventListener('click',function(e){
  var qb=e.target.closest('[data-qk],[data-qx]');if(qb){ST.qst=ST.qst||{};var qi=qb.getAttribute('data-qk');if(qi){if(ST.qst[qi]==='k')delete ST.qst[qi];else ST.qst[qi]='k';}else{ST.qst[qb.getAttribute('data-qx')]='x';}save();render();return;}
  var t=e.target.closest('[data-go]');if(t){goId(t.getAttribute('data-go'));return;}
  if(!MANUAL_ON)return;var m=e.target.closest('[data-man]');if(!m)return;
  var k=m.getAttribute('data-man');ST.manual[k]=Math.max(0,(ST.manual[k]||0)+(e.shiftKey?-1:1));save();render();
});
document.addEventListener('pause',function(){if(playing){playing=false;render();}},true);
document.addEventListener('ended',function(){if(playing){playing=false;render();}},true);
window.addEventListener('resize',fit);
try{CUR=+sessionStorage.getItem('ravasara-v2-cur')||0;}catch(e){}
fit();render();
lib('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js',function(){qr();lib('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js',connect);});
})();
</script>
