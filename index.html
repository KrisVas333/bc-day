<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Club Diena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;600;800&display=swap">
<style>
:root{--ground:#FFFFFF;--surface:#F7F7F5;--ink:#0A0A0A;--muted:#595959;--line:#E5E2DE;
--accent:#D90429;--red:#FF0000;--good:#12897A;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
--body:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;--r:4px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ground);color:var(--ink);font-family:var(--body)}
#net{position:fixed;inset:0;z-index:0;opacity:.07;pointer-events:none}
.stage{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column}
.eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:clamp(11px,1.6vw,14px);color:var(--accent);font-weight:700}
h1{font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;font-weight:800;
font-size:clamp(26px,5.4vw,58px);line-height:1.08;margin:.25em 0;text-wrap:balance}
.sub{font-size:clamp(16px,2.4vw,24px);line-height:1.45;max-width:26em}
.slide{display:none;flex:1;padding:5vh 5vw 12vh;flex-direction:column;justify-content:center}
.slide.on{display:flex}
.center{align-items:center;text-align:center}
.center .sub{margin-inline:auto}
.rword{color:var(--accent)}
.gifslot{background:repeating-linear-gradient(45deg,#f2f0ec 0 12px,#faf9f7 12px 24px);
border:1px dashed var(--line);border-radius:var(--r);display:grid;place-items:center;
color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;
letter-spacing:.06em;text-align:center;padding:8px;animation:pulse 2.4s infinite;min-height:110px}
@keyframes pulse{50%{opacity:.6}}
.gifwide{width:min(680px,92vw);min-height:170px;margin:14px auto}
.tlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:20px 0;width:100%;max-width:1080px}
.tlb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:center}
.tlb b{display:block;font-size:26px}
.tlb .nm{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.tlb .yr{display:none;color:var(--accent);font-family:var(--mono);font-weight:800;font-size:13px;margin-top:6px}
.tlb .gifslot{display:none;margin-top:8px;min-height:70px}
.tlb.open{border-color:var(--accent)}
.tlb.open .yr{display:block}
.tlb.open .gifslot{display:grid}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0;width:100%;max-width:1080px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;text-align:left}
.card h3{font-family:var(--mono);font-size:14px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
.card .fix{display:none;color:var(--muted);font-size:14.5px;margin-top:6px}
.card.open{border-color:var(--accent)}
.card.open .fix{display:block}
.card .emo{font-size:28px}
.card p{font-size:14px;color:var(--muted);margin:0}
.boss{border:2px solid var(--accent)}
.qbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:14px 18px;margin:9px 0;max-width:780px;width:100%;text-align:left;cursor:pointer}
.qbox p{margin:0;font-size:clamp(16px,2.2vw,21px);font-weight:600}
.qbox .ans{display:none;color:var(--accent);font-weight:800;margin-top:8px}
.qbox.open .ans{display:block}
.btn{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;font-weight:700;
border-radius:var(--r);border:1px solid var(--accent);cursor:pointer;padding:14px 22px;font-size:15px}
.btn-red{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;color:var(--accent)}
.sortgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px;width:100%;max-width:900px;margin:14px 0}
.sortit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;font-size:15px;cursor:pointer;text-align:left}
.sortit.g{border-color:var(--good);background:#eefaf7}
.sortit.b{border-color:var(--accent);background:#fdeef0}
.sortit .why{display:none;font-size:12.5px;color:var(--muted);margin-top:4px}
.sortit.g .why,.sortit.b .why{display:block}
.choice{display:block;width:100%;max-width:640px;text-align:left;background:var(--surface);
border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:6px 0;font-size:16.5px;cursor:pointer;font-family:var(--body)}
.choice.ok{border-color:var(--good);background:#eefaf7}
.choice.bad{border-color:var(--accent);background:#fdeef0}
#timer{font-family:var(--mono);font-weight:800;font-size:30px;color:var(--accent)}
#certCard{border:3px solid var(--accent);border-radius:var(--r);padding:28px 26px;max-width:640px;margin:14px auto;background:#fff;display:none}
#certCard .cn{font-family:var(--mono);font-size:clamp(22px,4vw,38px);font-weight:800;text-transform:uppercase;margin:.3em 0;color:var(--accent)}
#certCard p{margin:.35em 0}
.lvl{font-family:var(--mono);font-weight:800;font-size:clamp(20px,3vw,30px)}
.hud{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;align-items:center;
padding:10px 14px;background:rgba(255,255,255,.92);border-top:1px solid var(--line)}
.hud button{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:8px 12px;cursor:pointer}
.hud .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
#bar{position:fixed;top:0;left:0;height:4px;background:var(--accent);width:0;z-index:6;transition:width .3s}
#notes{position:fixed;right:12px;bottom:56px;z-index:6;max-width:370px;background:#0A0A0A;color:#fff;
border-radius:var(--r);padding:14px 16px;font-size:13.5px;line-height:1.5;display:none}
#notes b{color:#FF6B6B;font-family:var(--mono);font-size:11px;letter-spacing:.08em}
#start{position:fixed;inset:0;z-index:10;background:var(--ground);display:flex;flex-direction:column;
align-items:center;justify-content:center;text-align:center;padding:6vw;gap:10px}
#start .modes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.small{font-size:13px;color:var(--muted)}
#qr{margin:12px auto;background:#fff;padding:10px;width:fit-content;border:1px solid var(--line);border-radius:var(--r)}
input.inp{font-size:17px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);width:min(240px,70vw);font-family:var(--body)}
.dino{font-size:clamp(56px,11vw,120px);line-height:1}
#maxfx{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(255,255,255,.96)}
#maxfx.on{display:grid;animation:flashin .25s}
#maxfx h2{font-family:var(--mono);font-weight:800;font-size:clamp(40px,10vw,120px);color:var(--accent);
letter-spacing:.05em;animation:slam .5s cubic-bezier(.2,2.2,.4,1)}
@keyframes slam{0%{transform:scale(4);opacity:0}70%{transform:scale(.92)}100%{transform:scale(1);opacity:1}}
@keyframes flashin{0%{background:#D90429}100%{background:rgba(255,255,255,.96)}}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:860px;margin:16px 0}
.vs .card{cursor:default}
@media(max-width:640px){.vs{grid-template-columns:1fr}}

.gimg{width:100%;border-radius:var(--r);object-fit:cover;display:block;min-height:110px;max-height:160px;animation:kb 14s ease-in-out infinite alternate}
img.gifwide{max-height:340px;min-height:170px;width:min(680px,92vw);margin:14px auto}
@keyframes kb{0%{transform:scale(1)}100%{transform:scale(1.05)}}
@media (prefers-reduced-motion: reduce){.gimg{animation:none}}
#dinovid{width:min(720px,94vw);border-radius:var(--r);display:block;margin:6px auto 0}
#startlogo{width:min(260px,60vw);margin-top:22px;opacity:.92}
@media print{.hud,#bar,#notes,#net{display:none!important}.slide{display:none!important}
#certCard{display:block!important;border-width:4px}body{background:#fff}}
</style>
</head>
<body>
<canvas id="net"></canvas>
<div id="bar"></div>
<div id="maxfx" onclick="this.classList.remove('on')"><h2>BRAIN&nbsp;MAX</h2></div>

<div id="start">
  <p class="eyebrow">BRAIN CLUB DIENA · 3–6 KLASĖ</p>
  <h1>Nebūk <span class="rword">dinozauras</span>.<br>Evoliucionuok.</h1>
  <p class="sub">Dokumentika apie tavo galingiausią įrenginį — ir 3 VR zonos jį treniruoti.</p>
  <video id="dinovid" autoplay muted loop playsinline src="assets/img/dino-meteor.mp4" onerror="this.style.display='none'"></video>
  <div class="modes">
    <button class="btn btn-red" onclick="startShow('live')">🎤 Gyvas pristatymas</button>
    <button class="btn btn-ghost" onclick="startShow('voice')">🔊 Su balsu</button>
    <button class="btn btn-ghost" onclick="startShow('auto')">🤖 Auto-rodymas</button>
  </div>
  <p class="small">⚗️ Eksperimentinis prototipas, kurtas su AI. 🔊 Balsas — ElevenLabs LT dokumentikos pasakotojas.<br>Klavišai: → kitas · ← atgal · N — vedėjo užrašai</p>
  <img id="startlogo" src="assets/img/bc-logo.png" alt="Brain Club">
</div>

<div class="stage" id="stage"></div>

<div id="notes"></div>
<div class="hud">
  <button onclick="prev()">←</button>
  <button onclick="next()">→</button>
  <button onclick="toggleNotes()">📝 Užrašai</button>
  <button onclick="speakCur()">🔊</button>
  <span class="cnt" id="cnt"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

}

{ey:"BRAIN CLUB DIENA", cls:"center",
 html:"<h1>Kokį įrenginį turėsi <span class='rword'>VISĄ</span> gyvenimą?</h1>"+

{ey:"EVOLIUCIJA", cls:"center",

 "<div class='tlgrid'>"+

 "<div class='tlb' onclick='this.classList.toggle(\"open\")'><b>🤖</b><span class='nm'>AI</span><span class='yr'>DABAR</span>"+slot("Neuronų tinklas gyvai")+"</div>"+

/* ===== VARIKLIS ===== */
var cur=0, MODE="live";
function build(){
  var st=document.getElementById("stage");
  SL.forEach(function(s,i){
    var d=document.createElement("section");
    d.className="slide "+(s.cls||""); d.id="s"+i;
    d.innerHTML="<p class='eyebrow'>"+s.ey+"</p>"+s.html;
    st.appendChild(d);
  });
  try{ new QRCode(document.getElementById("qr"),{text:QR_URL,width:150,height:150,correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ document.getElementById("qr").textContent=QR_URL; }
}
function show(i){
  cur=Math.max(0,Math.min(SL.length-1,i));
  document.querySelectorAll(".slide").forEach(function(el,j){el.classList.toggle("on",j===cur)});
  document.getElementById("bar").style.width=((cur+1)/SL.length*100)+"%";
  document.getElementById("cnt").textContent=(cur+1)+" / "+SL.length;
  renderNotes();
  if(MODE==="voice"||MODE==="auto") speakCur();
}
function next(){show(cur+1)} function prev(){show(cur-1)}
function startShow(m){MODE=m;document.getElementById("start").style.display="none";
  if(m==="live")document.getElementById("notes").style.display="block";show(0)}
function toggleNotes(){var n=document.getElementById("notes");
  n.style.display=(n.style.display==="block")?"none":"block";renderNotes()}
function renderNotes(){var n=document.getElementById("notes");var s=SL[cur];
  n.innerHTML="<b>KĄ SAKYTI</b><br>"+s.notes.say+"<br><b>KĄ DARYTI</b><br>"+s.notes.do+"<br><b>TILTAS</b><br>"+s.notes.br}
var VOA=new Audio();
function speakCur(){
  VOA.pause();
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
  var n=cur+1, f="assets/vo/"+(n<10?"0":"")+n+".mp3";
  VOA.src=f;
  VOA.onended=function(){ if(MODE==="auto"&&cur<SL.length-1) setTimeout(next,1300); };
  VOA.onerror=function(){ speakTTS(); };
  VOA.play().catch(function(){ speakTTS(); });
}
function speakTTS(){
  if(!("speechSynthesis" in window))return;
  var u=new SpeechSynthesisUtterance(SL[cur].voice);
  u.lang="lt-LT";u.rate=0.93;
  u.onend=function(){ if(MODE==="auto"&&cur<SL.length-1) setTimeout(next,1300); };
  window.speechSynthesis.speak(u);
}
document.addEventListener("keydown",function(e){
  if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight")next();
  if(e.key==="ArrowLeft")prev();
  if(e.key==="n"||e.key==="N")toggleNotes();
});

/* ===== GERA/BLOGA ===== */
var sortDone=0,sortOk=0;
function sortPick(el){
  if(el.classList.contains("g")||el.classList.contains("b"))return;
  el.classList.add(el.getAttribute("data-k"));
  sortDone++;
  document.getElementById("sortScore").textContent="Atskleista: "+sortDone+" / 8";
}

/* ===== BRAIN MAX FX ===== */
function brainMax(){
  var fx=document.getElementById("maxfx");fx.classList.add("on");
  document.getElementById("maxlist").style.display="grid";
  try{
    var A=new (window.AudioContext||window.webkitAudioContext)();
    var o=A.createOscillator(),g=A.createGain();
    o.type="square";o.frequency.value=55;g.gain.value=.4;
    o.connect(g);g.connect(A.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.001,A.currentTime+.7);o.stop(A.currentTime+.75);
  }catch(e){}
  setTimeout(function(){fx.classList.remove("on")},1400);
}

/* ===== 10 KLAUSIMŲ TESTAS ===== */
var QZ=[
 {q:"Kokį įrenginį turėsi visą gyvenimą?",a:["Telefoną","Smegenis","Planšetę"],ok:1},
 {q:"Prieš kiek metų žmonės prisijaukino ugnį?",a:["Prieš ~100 metų","Prieš ~1 milijoną metų","Prieš 20 metų"],ok:1},
 {q:"Kiek žmonių dirbo Apollo programoje?",a:["Apie 40","Apie 4 000","Apie 400 000"],ok:2},
 {q:"Kas yra brain rot?",a:["Begalinis pasyvus video srautas","Sporto treniruotė","Naujas žaidimas"],ok:0},
 {q:"Kiek miego reikia tavo amžiui?",a:["4–5 val.","9–11 val.","15 val."],ok:1},
 {q:"Kiek judėjimo reikia kasdien?",a:["5 min","60 min","Nereikia visai"],ok:1},
 {q:"Kas nutiko Londono taksistų smegenims?",a:["Nieko","Atminties centras užaugo","Sumažėjo"],ok:1},
 {q:"Kas yra metakognicija?",a:["Mąstymas apie savo mąstymą","Robotų kalba","Žaidimo lygis"],ok:0},
 {q:"Kuo AI agentas skiriasi nuo pokalbio roboto?",a:["Niekuo","Gauna tikslą ir pats veikia","Yra lėtesnis"],ok:1},
 {q:"Kokia buvo dinozaurų klaida?",a:["Per daug miegojo","Nesugebėjo prisitaikyti","Per daug žaidė"],ok:1}];
var qi=0,correct=0,tmr=null,tleft=12;
function startQuiz(){
  var n=(document.getElementById("nm").value||"").trim();
  if(!n){document.getElementById("nm").focus();return}
  document.getElementById("quizIntro").style.display="none";
  qi=0;correct=0;renderQ();
}
function renderQ(){
  var el=document.getElementById("quiz");
  clearInterval(tmr);
  if(qi>=QZ.length){finishQuiz();return}
  var q=QZ[qi];
  var h="<p class='small'>Klausimas "+(qi+1)+" / 10 · <span id='timer'>12</span> s</p>"+
        "<p class='sub'><b>"+q.q+"</b></p>";
  q.a.forEach(function(t,j){h+="<button class='choice' onclick='pick(this,"+j+")'>"+t+"</button>"});
  el.innerHTML=h;
  tleft=12;
  tmr=setInterval(function(){
    tleft--;var t=document.getElementById("timer");if(t)t.textContent=tleft;
    if(tleft<=0){clearInterval(tmr);qi++;renderQ();}
  },1000);
}
function pick(btn,j){
  clearInterval(tmr);
  var ok=(j===QZ[qi].ok);
  btn.classList.add(ok?"ok":"bad");
  if(ok)correct++;
  setTimeout(function(){qi++;renderQ()},600);
}
function finishQuiz(){
  document.getElementById("quiz").innerHTML="";
  var lvl,line;
  if(correct===10){lvl="🚀 KOSMOSO SMEGENYS";line="Aukščiausias lygis — 10/10. Ateitis tavęs laukia.";}
  else if(correct>=8){lvl="🧠 BRAIN MAXER";line="Rezultatas "+correct+"/10 — smegenys treniruotos!";}
  else if(correct>=6){lvl="🐒 EVOLIUCIONIERIUS";line="Rezultatas "+correct+"/10 — evoliucija įsibėgėjo.";}
  else {lvl="🦖 DINOZAURIUKAS";line="Rezultatas "+correct+"/10 — evoliucija = bandyti dar kartą!";}
  var n=(document.getElementById("nm").value||"").trim();
  var a=(document.getElementById("ag").value||"").trim();
  document.getElementById("certName").textContent=n+(a?(", "+a+" m."):"");
  document.getElementById("certLvl").textContent=lvl;
  document.getElementById("certLine").textContent=line+" Žino: evoliucija = mokytis mokytis, valdyti smegenis ir technologijas.";
  document.getElementById("certDate").textContent="Brain Club Diena · "+new Date().toLocaleDateString("lt-LT");
  document.getElementById("certCard").style.display="block";
}

/* ===== NEURONŲ FONAS ===== */
(function(){
  var c=document.getElementById("net"),x=c.getContext("2d"),W,H,P=[];
  function rs(){W=c.width=innerWidth;H=c.height=innerHeight}
  rs();addEventListener("resize",rs);
  for(var i=0;i<26;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4});
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function step(){
    x.clearRect(0,0,W,H);
    P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      x.fillStyle="#D90429";x.beginPath();x.arc(p.x,p.y,2.2,0,7);x.fill()});
    for(var i=0;i<P.length;i++)for(var j=i+1;j<P.length;j++){
      var dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d=dx*dx+dy*dy;
      if(d<26000){x.strokeStyle="rgba(217,4,41,.35)";x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);x.stroke()}}
    if(!reduce)requestAnimationFrame(step);
  }
  step();
})();

build();show(0);
</script>
